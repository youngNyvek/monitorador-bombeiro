<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Use o celular como monitor visual da tela do computador." />
    <title>Monitor Visual Local</title>
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="panel hero-panel" id="hero-panel">
        <p class="eyebrow">Monitor visual local</p>
        <h1>Câmera como monitor</h1>
        <div class="hero-actions">
          <button id="prepare-button" class="primary-action">Abrir câmera</button>
          <button id="hero-history-button" class="ghost-action">Histórico</button>
        </div>
      </section>

      <section class="panel banner-panel" id="banner-panel" hidden aria-live="assertive">
        <p id="banner-message"></p>
      </section>

      <section class="panel camera-panel" id="camera-panel" hidden>
        <header class="panel-header">
          <div>
            <p class="eyebrow">Câmera</p>
            <h2>Câmera</h2>
          </div>
          <p class="helper-text" id="camera-resolution-text">Aguardando.</p>
        </header>

        <div class="video-shell" id="video-frame">
          <video id="camera-video" playsinline muted autoplay></video>
        </div>

        <section class="panel-subsection preflight-card" id="preflight-panel" hidden>
          <header class="subsection-header">
            <div>
              <h3>Teste</h3>
            </div>
          </header>

          <div class="preflight-checklist" aria-label="Testes obrigatórios">
            <span class="tag preflight-tag" id="preflight-preview-tag">Leitura pendente</span>
            <span class="tag preflight-tag" id="preflight-alert-tag">Alarme pendente</span>
          </div>

          <div class="preflight-actions">
            <button id="capture-preview-button" class="secondary-action">Leitura</button>
            <button id="test-alert-button" class="secondary-action">Alarme</button>
          </div>

          <button id="stop-test-alert-button" class="ghost-action preflight-stop" hidden>Parar</button>
          <button id="start-monitoring-button" class="primary-action big-action" disabled>Iniciar</button>

          <section class="panel-subsection preview-card">
            <header class="subsection-header">
              <div>
                <h3>Prévia</h3>
              </div>
            </header>
            <canvas id="preview-canvas" width="1" height="1"></canvas>
          </section>
        </section>

        <div class="camera-actions" id="monitoring-actions">
          <button id="pause-button" class="secondary-action">Pausar monitoramento</button>
          <button id="resume-button" class="secondary-action" hidden>Retomar monitoramento</button>
          <button id="stop-camera-button" class="ghost-action">Encerrar câmera</button>
          <button id="history-toggle-button" class="ghost-action">Histórico</button>
        </div>
      </section>

      <details class="panel status-panel" id="status-panel" hidden>
        <summary class="status-summary">
          <div class="status-summary-main">
            <span class="status-chip" id="mode-chip">idle</span>
            <div>
            <p class="status-title">OCR</p>
            <p class="status-text" id="status-text">Pronto.</p>
            </div>
          </div>
          <span class="status-summary-hint">Abrir</span>
        </summary>

        <div class="status-body">
          <div class="status-grid">
            <div class="status-metric">
              <span>Última leitura</span>
              <strong id="last-analysis-text">-</strong>
            </div>
            <div class="status-metric">
              <span>Texto lido</span>
              <pre id="last-recognized-text">-</pre>
            </div>
            <div class="status-metric">
              <span>Confirmações</span>
              <strong id="confirmation-count-text">0</strong>
            </div>
            <div class="status-metric">
              <span>Rearme</span>
              <strong id="clear-count-text">0</strong>
            </div>
          </div>
        </div>
      </details>

      <section class="panel settings-panel" id="settings-panel" hidden>
        <header class="panel-header">
          <div>
            <p class="eyebrow">Configuração</p>
            <h2>Leitura e alertas</h2>
          </div>
        </header>

        <div class="form-grid">
          <label class="field field-wide">
            <span>Texto principal</span>
            <input id="expected-text-input" type="text" />
          </label>

          <label class="field field-wide">
            <span>Palavras-chave</span>
            <textarea id="keywords-input" rows="3"></textarea>
          </label>

          <label class="field">
            <span>Modo</span>
            <select id="keyword-mode-select">
              <option value="all">Todas as palavras</option>
              <option value="any">Basta uma palavra</option>
            </select>
          </label>

          <label class="field">
            <span>Intervalo (ms)</span>
            <input id="analysis-interval-input" type="number" min="500" step="250" />
          </label>

          <label class="field">
            <span>Confirmações</span>
            <input id="required-confirmations-input" type="number" min="1" max="10" step="1" />
          </label>

          <label class="field">
            <span>Rearme</span>
            <input id="clear-confirmations-input" type="number" min="1" max="10" step="1" />
          </label>

          <label class="field">
            <span>Entre alertas (ms)</span>
            <input id="min-alert-interval-input" type="number" min="1000" step="500" />
          </label>

          <label class="field checkbox-field">
            <span>Vibração</span>
            <input id="vibration-toggle" type="checkbox" />
          </label>

          <label class="field checkbox-field">
            <span>Som</span>
            <input id="sound-toggle" type="checkbox" />
          </label>

          <label class="field checkbox-field field-wide">
            <span>Salvar imagem</span>
            <input id="save-crops-toggle" type="checkbox" />
          </label>
        </div>

        <section class="panel-subsection preprocess-card">
          <header class="subsection-header">
            <div>
              <h3>Pré-processamento</h3>
            </div>
          </header>

          <div class="form-grid compact-grid">
            <label class="field">
              <span>Escala</span>
              <select id="preprocess-scale-select">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
              </select>
            </label>

            <label class="field checkbox-field">
              <span>Sem cor</span>
              <input id="preprocess-grayscale-toggle" type="checkbox" />
            </label>

            <label class="field checkbox-field">
              <span>Inverter</span>
              <input id="preprocess-invert-toggle" type="checkbox" />
            </label>

            <label class="field field-wide">
              <span>Contraste</span>
              <input id="preprocess-threshold-input" type="range" min="0" max="255" step="1" />
              <small class="helper-text"><strong id="preprocess-threshold-value">0</strong></small>
            </label>
          </div>
        </section>
      </section>

      <section class="panel history-panel" id="history-panel" hidden>
        <header class="panel-header history-header">
          <div>
            <p class="eyebrow">Histórico</p>
            <h2>Histórico</h2>
          </div>
          <div class="history-meta">
            <strong id="history-total-count">0</strong>
            <label class="field history-filter-field">
              <span>Data</span>
              <input id="history-date-filter" type="date" />
            </label>
          </div>
        </header>

        <div class="history-actions">
          <button id="clear-history-button" class="ghost-action danger-text">Limpar</button>
        </div>

        <div id="history-list" class="history-list"></div>
      </section>

      <section class="alert-overlay" id="alert-shell" hidden role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
        <div class="alert-card">
          <p class="eyebrow">Alerta</p>
          <h2 id="alert-title">Alerta</h2>
          <p id="alert-time-text" class="alert-time"></p>
          <button id="stop-alert-button" class="danger-action big-action">Parar</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
